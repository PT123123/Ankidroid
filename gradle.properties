# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4g + 1g metaspace: this fork's arm64-only, 5-locale release build passed a forced Kotlin + R8
# run at it (docs/development/fork-build-speed.md). Keep the Justfile off this line - a different
# value means a different daemon, so a CLI override costs an extra cold start every invocation.
# Measured 2026-10-28: `minifyPlayReleaseWithR8` alone puts 3703 MB working set inside this JVM
# (AGP runs R8 in-process), so this cap is load-bearing for the minified release path - do not lower
# it. `just build-release` skips that task (-PskipMinify=true) and so does not need 4g, but there is
# only one -Xmx per daemon: a smaller value for the daily path means a second daemon, i.e. two
# heaps retained instead of one.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The Kotlin daemon otherwise inherits the line above, i.e. a second 4g heap + 1g metaspace that
# nobody budgeted. A cold full recompile of :AnkiDroid measured 2995 MB of commit at -Xmx4g and
# 3m 16s at -Xmx2g (vs 3m 30s uncapped), so 2g bounds the ceiling without thrashing.
# Its lifetime follows the Gradle daemon, not its own timer: the client-liveness channel is the
# flag file behind -Dkotlin.daemon.client.alive.path (that is the only `alive` key Kotlin 2.3.21
# ships - there is no alive *timeout*, so do not add one, it would be inert), and
# DaemonOptions.autoshutdown*Idle/UnusedSeconds default to 0 = skipped. So `idletimeout` below and
# `just stop` are what hand this 2g back; see docs/development/fork-build-speed.md.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Concurrent task executions. The two expensive tasks (R8, lintVital) are single tasks running
# thread-isolated inside the daemon, so this does not cut their peak; it only bounds how many
# medium tasks (dex buckets, resource merges) can be resident at once. Chosen for the smaller
# in-flight footprint; wall time of a cold release at 2 has not been measured yet.
org.gradle.workers.max=2

# Hand the ~4g (daemon) + ~2g (Kotlin) back five minutes after a build instead of holding the
# G1 high-water mark: `minifyPlayReleaseWithR8` leaves this JVM at 3992 MB of commit and G1 does
# not uncommit on its own, so the retention is what you see in Task Manager between builds.
# Cost is one cold JVM (~30-60 s) if you resume more than 5 minutes later; `just stop` does it
# immediately. Raise it back to 1200000 if the cold starts annoy you more than the RAM does.
# This is also the only timer that releases the Kotlin daemon: when this JVM goes away its
# client-alive flag file stops being refreshed and the daemon logs "Dying" and exits, so the ~2g
# comes with the ~4g. Nothing shorter than this exists on the Kotlin side (see the line above).
org.gradle.daemon.idletimeout=300000

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# With de-coupled gradle sub-modules, they may run in parallel
org.gradle.parallel=true

# The default in the future, let's true the future now...
org.gradle.caching=true

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Enable file system watching (should reduce disk IO and increase incremental build speed).
org.gradle.vfs.watch=true

# Enable Kotlin support for Android test fixtures
android.experimental.enableTestFixturesKotlinSupport=true

# Keeper does not tolerate newDsl in AGP9 yet
# it is fixed on a fork https://github.com/slackhq/keeper/pull/154#issuecomment-3921848493
# ...but keeper looking for long-term home, AGP9 compatibility is currently unpublished
# attempting to use the github maven repo package publish from that comment did not work initially
# perhaps can vendor a compiled lib / local maven repository for that plugin
android.newDsl=false

# Enable parallel sync for Gradle 9.4+ and Android Quail
# https://docs.gradle.org/current/userguide/build_environment.html#gradle_properties_reference
# https://developer.android.com/studio/releases/past-releases/as-quail-1-release-notes#android_studio_quail_1_parallel_gradle_sync_execution_change
org.gradle.tooling.parallel=true
