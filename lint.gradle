// see .editorconfig for ktlint-related rules
// TODO: move to buildSrc when api/ has a convention plugin and AnkiDroid/build.gradle is converted to .kts

android {
    lint {
        abortOnError = true
        // checkReleaseBuilds is what wires lintVitalAnalyzePlayRelease (~5m49s measured alone,
        // more than R8) into `assemblePlayRelease`. `-PskipReleaseLint=true` drops it, which is how
        // `just build-release` and `just minify-release` avoid sharing one 4g heap with R8; `just
        // lint-release` runs the gate as its own invocation and `just publish` depends on `just
        // release-check` (minify then lint), so a publish still gets UnusedResources.
        checkReleaseBuilds = project.findProperty("skipReleaseLint") != "true"
        checkTestSources = true
        explainIssues = false
        lintConfig = file("${rootDir}/lint-release.xml")
        showAll = true
        // To output the lint report to stdout set textReport=true, and leave textOutput unset.
        textReport = true
        warningsAsErrors = true

        if (System.getenv("CI") == "true") {
            // 14853: we want this to appear in the IDE, but it adds noise to CI
            disable += "WrongThread"
            disable += "ThreadConstraint"
        }
    }
}